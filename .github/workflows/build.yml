          package com.hussein.veil

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.widget.TextView

          object Cfg {
              const val PREFS = "s"

              val AMBER = 0xFFE0A45A.toInt()
              val CREAM = 0xFFEDE6DA.toInt()
              val DIM = 0xFF8C8C8C.toInt()
              val CHIP = 0xFF1B1C1E.toInt()
              val LINE = 0xFF2A2B2D.toInt()
              val DARK = 0xFF141414.toInt()

              val veilColors = intArrayOf(0xFF070A12.toInt(), 0xFF1C2330.toInt(), 0xFF1A120C.toInt(), 0xFF000000.toInt())
              val ctlColors = intArrayOf(AMBER, 0xFFF2F2F2.toInt(), 0xFFE5604F.toInt(), 0xFF5DBB7A.toInt(), 0xFF5B9BE0.toInt())
              val decoyBg = intArrayOf(0, 0xFFF6F4EF.toInt(), 0xFFD9E8F7.toInt(), 0xFFFFF4B8.toInt(), 0xFFFBEFE2.toInt())

              fun styleControl(ctx: Context, t: TextView, p: SharedPreferences) {
                  val d = ctx.resources.displayMetrics.density
                  val sizeDp = p.getInt("csize", 42)
                  val h = sizeDp * d
                  val col = ctlColors[p.getInt("ccolor", 0).coerceIn(0, ctlColors.size - 1)]
                  val bg = GradientDrawable()
                  bg.cornerRadius = when (p.getInt("cshape", 0)) {
                      0 -> h * 0.3f
                      1 -> h / 2f
                      else -> 3 * d
                  }
                  when (p.getInt("cstyle", 0)) {
                      0 -> {
                          bg.setColor(col)
                          t.setTextColor(DARK)
                      }
                      1 -> {
                          bg.setColor(0xCC111111.toInt())
                          bg.setStroke((2 * d).toInt(), col)
                          t.setTextColor(col)
                      }
                      else -> {
                          bg.setColor((col and 0x00FFFFFF) or 0x66000000)
                          t.setTextColor(Color.WHITE)
                      }
                  }
                  t.background = bg
                  t.gravity = Gravity.CENTER
                  t.textSize = sizeDp * 0.33f
                  t.typeface = Typeface.DEFAULT_BOLD
                  t.setPadding(0, 0, 0, 0)
              }
          }
