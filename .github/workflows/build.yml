              fun armCard(title: String, desc: String, key: String, def: Boolean) {
                  val card = LinearLayout(ctx)
                  card.orientation = LinearLayout.HORIZONTAL
                  card.setBackgroundColor(0xFF1C2330.toInt())
                  val bar = View(ctx)
                  bar.setBackgroundColor(0xFF3A4452.toInt())
                  card.addView(bar, LinearLayout.LayoutParams(dp(3), MATCH))
