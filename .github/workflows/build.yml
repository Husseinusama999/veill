              <string name="intro">Keep typing in any app. Drop a veil over the screen so the person beside you sees nothing, while your own words stay faintly readable.</string>
              <string name="intro2">The control starts on the keyboard and can be dragged anywhere, and the veil keeps your own text faintly readable.</string>
              <string name="setup">Setup</string>
              <string name="s1_t">Draw over apps</string>
              <string name="s1_d">Draws the veil and its control above other apps.</string>
              <string name="s2_t">Keyboard awareness</string>
              <string name="s2_d">Notices when a keyboard opens. Never reads keystrokes.</string>
              <string name="ready">READY</string>
              <string name="allow">ALLOW</string>
              <string name="arm_t">Arm the veil</string>
              <string name="arm_d">Runs quietly until you need it</string>
              <string name="tuning">Tuning</string>
              <string name="opacity_t">Veil opacity</string>
              <string name="opacity_d">Lower means you can read your own text through it.</string>
              <string name="photo_t">Veil photo</string>
              <string name="choose">Choose</string>
              <string name="photo_d">Fills the veil with a photo from your gallery.</string>
              <string name="remove_photo">Remove photo</string>
              <string name="photo_ok">Photo set</string>
              <string name="photo_fail">Could not open the image</string>
              <string name="decoy_t">Decoy</string>
              <string name="decoy_d">Instead of a dark veil, a dull everyday page. Anyone glancing over sees someone reading the news, not someone hiding something.</string>
              <string name="style_t">Veil style</string>
              <string name="style_d">Four tones of dark.</string>
              <string name="offset_t">Keyboard offset</string>
              <string name="none">None</string>
              <string name="offset_d">Some keyboards keep a toolbar or suggestion strip along their top edge, and that strip is part of the keyboard window. Extend the veil down to cover as much of it as you need.</string>
              <string name="under_t">Use the app under the veil</string>
              <string name="under_d">Taps, scrolling and zoom reach the app below while it is covered. Peeking moves to a long press on the control.</string>
              <string name="cover_t">Cover notification pop-ups</string>
              <string name="cover_d">While the veil is down, messages that slide in at the top are covered too. You can still tap or swipe them.</string>
