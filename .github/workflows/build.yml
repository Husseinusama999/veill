          package com.hussein.veil

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView

          class AppsActivity : Activity() {

              override fun attachBaseContext(newBase: Context) {
                  super.attachBaseContext(Lang.wrap(newBase))
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val p = getSharedPreferences(Cfg.PREFS, MODE_PRIVATE)
                  val pm = packageManager
                  window.statusBarColor = 0xFF0B0C0E.toInt()
                  window.navigationBarColor = 0xFF0B0C0E.toInt()

                  val launcher = Intent(Intent.ACTION_MAIN)
                  launcher.addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(launcher, 0)
                      .map { Pair(it.loadLabel(pm).toString(), it.activityInfo.packageName) }
                      .filter { it.second != packageName }
                      .distinctBy { it.second }
                      .sortedBy { it.first.lowercase() }

                  val selected = HashSet<String>(p.getStringSet("apps", null) ?: emptySet<String>())

                  val head = TextView(this)
                  head.text = getString(R.string.apps_t)
                  head.textSize = 22f
                  head.setTextColor(Cfg.CREAM)
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.setPadding((22 * d).toInt(), (20 * d).toInt(), (22 * d).toInt(), (12 * d).toInt())

                  val list = ListView(this)
                  list.choiceMode = ListView.CHOICE_MODE_MULTIPLE
                  list.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_list_item_multiple_choice,
                      apps.map { it.first }
                  )
                  for (i in apps.indices) {
                      list.setItemChecked(i, selected.contains(apps[i].second))
                  }
                  list.setOnItemClickListener { _, _, pos, _ ->
                      val pkg = apps[pos].second
                      if (list.isItemChecked(pos)) selected.add(pkg) else selected.remove(pkg)
                      p.edit().putStringSet("apps", HashSet<String>(selected)).apply()
                  }

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setBackgroundColor(0xFF0B0C0E.toInt())
                  box.addView(head)
                  box.addView(list, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(box)
              }
          }
