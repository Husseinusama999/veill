                  row.addView(col, LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.addView(tv(status, 13f, Cfg.DIM, false, 0.15f))
                  row.setOnClickListener { onClick() }
                  root.addView(row, LinearLayout.LayoutParams(MATCH, WRAP))
