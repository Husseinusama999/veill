          import android.graphics.Paint
          import android.text.TextPaint
          import android.text.TextUtils
          import android.view.View

          class DecoyView(
              ctx: Context,
              private val kind: Int,
              private val title: String,
              private val lines: Array<String>
          ) : View(ctx) {

              private val p = TextPaint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(c: Canvas) {
                  val d = resources.displayMetrics.density
                  val rtl = layoutDirection == LAYOUT_DIRECTION_RTL
                  c.drawColor(Cfg.decoyBg[kind])
                  p.textAlign = if (rtl) Paint.Align.RIGHT else Paint.Align.LEFT
                  val x = if (rtl) width - 22 * d else 22 * d
                  val avail = width - 44 * d
                  p.color = 0xFF1E1E1E.toInt()
                  p.isFakeBoldText = true
                  p.textSize = 30 * d
                  c.drawText(title, x, 110 * d, p)
                  p.isFakeBoldText = false
                  p.textSize = 17 * d
                  var y = 170 * d
                  var i = 0
                  while (y < height) {
                      p.color = 0xFF3A3A3A.toInt()
                      val s = TextUtils.ellipsize(lines[i % lines.size], p, avail, TextUtils.TruncateAt.END)
                      c.drawText(s, 0, s.length, x, y, p)
                      p.color = 0x22000000
                      c.drawRect(22 * d, y + 18 * d, width - 22 * d, y + 19 * d, p)
                      y += 56 * d
                      i++
                  }
              }
          }
