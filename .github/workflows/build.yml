          fun buildPage(a: Activity): LinearLayout {
              val d = a.resources.displayMetrics.density
              val root = LinearLayout(a)
              root.orientation = LinearLayout.VERTICAL
              root.setPadding((22 * d).toInt(), (24 * d).toInt(), (22 * d).toInt(), (48 * d).toInt())
              val sv = ScrollView(a)
              sv.addView(root)
              sv.background = GradientDrawable(
                  GradientDrawable.Orientation.TOP_BOTTOM,
                  intArrayOf(0xFF17181B.toInt(), 0xFF08090B.toInt())
              )
              a.window.statusBarColor = 0xFF17181B.toInt()
              a.window.navigationBarColor = 0xFF08090B.toInt()
              a.setContentView(sv)
              return root
          }

          class Ui(private val ctx: Context, private val root: LinearLayout) {

              private val d = ctx.resources.displayMetrics.density
              private val p = ctx.getSharedPreferences(Cfg.PREFS, Context.MODE_PRIVATE)
              private val ar = ctx.resources.configuration.locales[0].language == "ar"
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              fun dp(v: Int): Int = (v * d).toInt()

              private fun ls(v: Float): Float = if (ar) 0f else v

              private fun rounded(color: Int, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = r * d
                  return g
              }

              private fun tv(text: String, size: Float, color: Int, bold: Boolean = false, spacing: Float = 0f): TextView {
                  val t = TextView(ctx)
                  t.text = text
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.typeface = Typeface.DEFAULT_BOLD
                  t.letterSpacing = ls(spacing)
                  t.setLineSpacing(0f, 1.12f)
                  return t
              }

              private fun lp(top: Int = 0): LinearLayout.LayoutParams {
                  val l = LinearLayout.LayoutParams(MATCH, WRAP)
                  l.topMargin = dp(top)
                  return l
              }

              private fun styleSwitch(s: Switch) {
                  val st = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  s.thumbTintList = ColorStateList(st, intArrayOf(Cfg.DARK, 0xFFBDBDBD.toInt()))
                  s.trackTintList = ColorStateList(st, intArrayOf(Cfg.AMBER, 0xFF3A3A3A.toInt()))
              }

              fun section(text: String, top: Int = 40) {
                  root.addView(tv(text, 13f, Cfg.AMBER, false, 0.15f), lp(top))
              }

              fun big(text: String) {
                  root.addView(tv(text, 52f, Cfg.CREAM, true, 0.02f), lp(14))
              }

              fun accent() {
                  val v = View(ctx)
                  v.setBackgroundColor(Cfg.AMBER)
                  val l = LinearLayout.LayoutParams(dp(48), dp(2))
                  l.topMargin = dp(18)
                  root.addView(v, l)
              }

              fun body(text: String, size: Float, color: Int, top: Int) {
                  root.addView(tv(text, size, color), lp(top))
              }

              fun desc(text: String) {
                  root.addView(tv(text, 15f, Cfg.DIM), lp(8))
              }

              fun divider() {
                  val v = View(ctx)
                  v.setBackgroundColor(Cfg.LINE)
                  root.addView(v, LinearLayout.LayoutParams(MATCH, dp(1)))
              }

              fun preview(compact: Boolean) {
                  root.addView(PreviewView(ctx, compact), lp(if (compact) 18 else 28))
              }

              private fun headRow(parent: LinearLayout, title: String, value: String?, top: Int): TextView {
                  val row = LinearLayout(ctx)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val v = tv(value ?: "", 14f, Cfg.AMBER, false, 0.1f)
                  row.addView(tv(title, 21f, Cfg.CREAM, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                  row.addView(v)
                  parent.addView(row, lp(top))
                  return v
              }

              fun head(title: String, value: String? = null, top: Int = 30): TextView = headRow(root, title, value, top)

              fun slider(
                  title: String,
                  desc: String?,
                  key: String,
                  def: Int,
                  min: Int,
                  max: Int,
                  fmt: (Int) -> String,
                  onChange: (() -> Unit)? = null
              ) {
                  val v = head(title, fmt(p.getInt(key, def)))
                  val bar = SeekBar(ctx)
                  bar.max = max - min
                  bar.progress = p.getInt(key, def) - min
                  bar.progressTintList = ColorStateList.valueOf(Cfg.AMBER)
                  bar.thumbTintList = ColorStateList.valueOf(Cfg.AMBER)
                  bar.progressBackgroundTintList = ColorStateList.valueOf(0xFF2A2B2D.toInt())
                  bar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, pr: Int, fromUser: Boolean) {
                          val x = pr + min
                          v.text = fmt(x)
                          p.edit().putInt(key, x).apply()
                          onChange?.invoke()
                      }

                      override fun onStartTrackingTouch(sb: SeekBar?) {}

                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
                  root.addView(bar, lp(10))
                  if (desc != null) desc(desc)
              }

              fun chips(names: Array<String>, key: String, def: Int, onChange: ((Int) -> Unit)? = null) {
                  val row = LinearLayout(ctx)
                  row.orientation = LinearLayout.HORIZONTAL
                  val tvs = ArrayList<TextView>()
                  fun paint(sel: Int) {
                      for (i in tvs.indices) {
                          val on = i == sel
                          tvs[i].setTextColor(if (on) Cfg.DARK else 0xFFBDBDBD.toInt())
                          tvs[i].background = rounded(if (on) Cfg.AMBER else Cfg.CHIP, 4)
                      }
                  }
                  for (i in names.indices) {
                      val t = tv(names[i].uppercase(), 12.5f, Cfg.DIM, false, 0.12f)
                      t.gravity = Gravity.CENTER
                      t.setPadding(dp(4), dp(14), dp(4), dp(14))
                      t.setOnClickListener {
                          p.edit().putInt(key, i).apply()
                          paint(i)
                          onChange?.invoke(i)
                      }
                      val l = LinearLayout.LayoutParams(0, WRAP, 1f)
                      if (i < names.size - 1) l.marginEnd = dp(8)
                      tvs.add(t)
                      row.addView(t, l)
                  }
                  paint(p.getInt(key, def))
                  root.addView(row, lp(14))
              }

              fun toggle(title: String, desc: String, key: String, def: Boolean, onChange: ((Boolean) -> Unit)? = null): Switch {
                  val row = LinearLayout(ctx)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val col = LinearLayout(ctx)
                  col.orientation = LinearLayout.VERTICAL
                  col.addView(tv(title, 21f, Cfg.CREAM, true))
                  col.addView(tv(desc, 15f, Cfg.DIM), lp(6))
                  val sw = Switch(ctx)
                  styleSwitch(sw)
                  sw.isChecked = p.getBoolean(key, def)
                  sw.setOnCheckedChangeListener { _, c ->
                      p.edit().putBoolean(key, c).apply()
                      onChange?.invoke(c)
                  }
                  val l = LinearLayout.LayoutParams(0, WRAP, 1f)
                  l.marginEnd = dp(14)
                  row.addView(col, l)
                  row.addView(sw)
                  root.addView(row, lp(30))
                  return sw
              }

              fun nav(title: String, desc: String, value: String, onClick: () -> Unit) {
                  divider()
                  val box = LinearLayout(ctx)
