          package com.hussein.veil

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.view.View

          class PreviewView(ctx: Context, private val compact: Boolean) : View(ctx) {

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onMeasure(widthSpec: Int, heightSpec: Int) {
                  val ww = MeasureSpec.getSize(widthSpec)
                  setMeasuredDimension(ww, (ww * (if (compact) 0.62f else 0.69f)).toInt())
              }

              override fun onDraw(c: Canvas) {
                  val d = resources.displayMetrics.density
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val clip = Path()
                  clip.addRoundRect(RectF(0f, 0f, w, h), 10 * d, 10 * d, Path.Direction.CW)
                  c.clipPath(clip)
                  val split = h * 0.72f
                  p.color = Color.BLACK
                  c.drawRect(0f, 0f, w, split, p)
                  p.color = 0xFF0D0E11.toInt()
                  c.drawRoundRect(RectF(w * 0.05f, h * 0.06f, w * 0.62f, h * 0.12f), 6 * d, 6 * d, p)
                  c.drawRoundRect(RectF(w * 0.05f, h * 0.3f, w * 0.75f, h * 0.36f), 6 * d, 6 * d, p)
                  p.color = 0xFF150F08.toInt()
                  c.drawRoundRect(RectF(w * 0.6f, h * 0.18f, w * 0.95f, h * 0.24f), 6 * d, 6 * d, p)
                  c.drawRoundRect(RectF(w * 0.55f, h * 0.44f, w * 0.95f, h * 0.5f), 6 * d, 6 * d, p)
                  p.color = Cfg.AMBER
                  c.drawRect(0f, split, w, split + 2 * d, p)
                  p.color = 0xFF0D1114.toInt()
                  c.drawRect(0f, split + 2 * d, w, h, p)
                  p.color = 0xFF1E2124.toInt()
                  val kh = (h - split) / 4.2f
                  val kw = w / 12f
                  for (row in 0..2) {
                      val n = if (row == 2) 7 else 10
                      val x0 = (w - n * kw) / 2f
                      for (i in 0 until n) {
                          val l = x0 + i * kw + 2 * d
                          val t = split + 2 * d + kh * 0.35f + row * kh * 1.05f
                          c.drawRoundRect(RectF(l, t, l + kw - 4 * d, t + kh * 0.8f), 3 * d, 3 * d, p)
                      }
                  }
                  val pl = w * 0.72f
                  val pt = split + 2 * d + kh * 0.3f
                  val pr = w * 0.97f
                  val pb = pt + kh * 1.5f
                  p.color = 0xFF14171A.toInt()
                  c.drawRoundRect(RectF(pl, pt, pr, pb), 12 * d, 12 * d, p)
                  p.color = Cfg.AMBER
                  c.drawRoundRect(RectF(pl + (pr - pl) * 0.28f, pt + 4 * d, pr - 6 * d, pb - 4 * d), 10 * d, 10 * d, p)
                  c.drawCircle(pl + (pr - pl) * 0.13f, (pt + pb) / 2f, 2.5f * d, p)
                  p.color = Cfg.DARK
                  p.textAlign = Paint.Align.CENTER
                  p.textSize = 11 * d
                  c.drawText(context.getString(R.string.veil_btn), pl + (pr - pl) * 0.64f, (pt + pb) / 2f + 4 * d, p)
              }
          }
