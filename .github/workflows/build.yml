              <string-array name="cstyle_names"><item>Fill</item><item>Outline</item><item>Glass</item></string-array>
              <string-array name="ccolor_names"><item>Amber</item><item>White</item><item>Red</item><item>Green</item><item>Blue</item></string-array>
              <string-array name="anim_names"><item>Slow</item><item>Normal</item><item>Fast</item><item>Instant</item></string-array>
              <string-array name="lang_names"><item>Auto</item><item>English</item><item>العربية</item></string-array>
