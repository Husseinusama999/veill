                  b.setPadding(0, dp(14), 0, dp(4))
                  b.setOnClickListener { onClick() }
                  root.addView(b, lp(0))
              }

              fun input(hint: String): EditText {
                  val e = EditText(ctx)
                  e.hint = hint
                  e.setHintTextColor(Cfg.DIM)
