              override fun onServiceConnected() {
                  super.onServiceConnected()
                  prefs.registerOnSharedPreferenceChangeListener(listener)
                  refresh()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  refresh()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  try {
                      prefs.unregisterOnSharedPreferenceChangeListener(listener)
                      getSystemService(NotificationManager::class.java)?.cancel(NOTIF_ID)
                  } catch (e: Exception) {
                  }
                  removeAllNow()
                  super.onDestroy()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun animMs(): Long = when (prefs.getInt("anim", 1)) {
                  0 -> 450L
                  1 -> 220L
                  2 -> 110L
                  else -> 0L
              }

              private fun statusBarHeight(): Int {
                  val id = resources.getIdentifier("status_bar_height", "dimen", "android")
                  return if (id > 0) resources.getDimensionPixelSize(id) else dp(24)
              }

              private fun refresh() {
                  try {
                      updateNotification()
                      if (!prefs.getBoolean("on", true)) {
                          removeAllNow()
                          return
                      }
                      val dm = resources.displayMetrics
                      var ime = -1
                      val r = Rect()
                      for (w in windows) {
                          if (w.type == AccessibilityWindowInfo.TYPE_INPUT_METHOD) {
                              w.getBoundsInScreen(r)
                              if (r.height() > 0 && r.top > 0) ime = r.top
                          }
                      }
                      lastIme = ime
                      if (ime < 0) kbToggled = false

                      val manualFull = prefs.getBoolean("full", false)
                      val full = manualFull || appMatch()
                      val kbActive = ime > 0 && (prefs.getBoolean("kbauto", false) != kbToggled)
                      val off = dp(prefs.getInt("offset", 0))

                      val bottom = when {
                          full -> if (ime > 0) minOf(ime + off, dm.heightPixels) else 0
                          kbActive -> minOf(ime + off, dm.heightPixels)
                          else -> -1
                      }
                      val topOff = if (prefs.getBoolean("cover", true)) 0 else statusBarHeight()
                      val opacity = if (full) prefs.getInt("fopacity", 90) else prefs.getInt("opacity", 92)

                      applyVeil(bottom, topOff, opacity, prefs.getBoolean("through", true))
                      val showBubble = ime > 0 || manualFull || prefs.getBoolean("fab", false)
                      applyBubble(showBubble, ime, bottom >= 0)
                  } catch (e: Exception) {
                      removeAllNow()
                  }
              }

              private fun appMatch(): Boolean {
                  val set = prefs.getStringSet("apps", null) ?: return false
                  if (set.isEmpty()) return false
                  if (prefs.getBoolean("qon", false)) {
                      val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                      val s = prefs.getInt("qs", 22)
                      val e = prefs.getInt("qe", 7)
                      val quiet = if (s == e) false else if (s < e) (h >= s && h < e) else (h >= s || h < e)
                      if (quiet) return false
                  }
                  for (w in windows) {
                      if (w.type == AccessibilityWindowInfo.TYPE_APPLICATION && w.isActive) {
                          val pkg = w.root?.packageName?.toString()
                          if (pkg != null) return set.contains(pkg)
                      }
                  }
                  return false
              }

              private fun applyVeil(bottom: Int, topOff: Int, opacity: Int, through: Boolean) {
                  if (bottom < 0) {
                      hideVeil()
                      return
                  }
                  val decoy = prefs.getInt("decoy", 0)
                  val sKey = "$opacity/${prefs.getInt("vstyle", 3)}/${prefs.getBoolean("photo", false)}/${prefs.getInt("photoVer", 0)}/$decoy/${prefs.getString("lang", "")}"
                  val height = if (bottom == 0) MATCH else maxOf(1, bottom - topOff)
                  val lKey = "$height/$topOff"

                  if (veil != null && lastThrough != through) hideVeilNow()

                  var v = veil
                  if (v == null) {
                      hideBubble()
                      val root = FrameLayout(this)
                      var flags = WLP.FLAG_NOT_FOCUSABLE or WLP.FLAG_LAYOUT_IN_SCREEN or WLP.FLAG_LAYOUT_NO_LIMITS
                      if (through) {
                          flags = flags or WLP.FLAG_NOT_TOUCHABLE
                      } else {
                          root.setOnTouchListener { view, ev ->
                              when (ev.actionMasked) {
                                  MotionEvent.ACTION_DOWN -> view.alpha = 0f
                                  MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> view.alpha = 1f
                              }
                              true
                          }
                      }
                      val lp = WLP(MATCH, height, WLP.TYPE_ACCESSIBILITY_OVERLAY, flags, PixelFormat.TRANSLUCENT)
                      lp.gravity = Gravity.TOP or Gravity.LEFT
                      lp.y = topOff
                      wm.addView(root, lp)
                      veil = root
                      v = root
                      lastThrough = through
                      layoutKey = lKey
                      styleKey = ""
                      val ms = animMs()
                      if (ms > 0) {
                          root.alpha = 0f
                          root.animate().alpha(1f).setDuration(ms).start()
                      }
                  }

                  if (styleKey != sKey) {
                      buildVeilContent(v, opacity, decoy)
                      styleKey = sKey
                  }
                  if (layoutKey != lKey) {
                      val lp = v.layoutParams as WLP
                      lp.height = height
                      lp.y = topOff
                      wm.updateViewLayout(v, lp)
                      layoutKey = lKey
                  }
              }

              private fun buildVeilContent(root: FrameLayout, opacity: Int, decoy: Int) {
                  root.removeAllViews()
                  val full = FrameLayout.LayoutParams(MATCH, MATCH)
                  if (decoy in 1..4) {
                      val res = Lang.wrap(this).resources
                      val title = res.getStringArray(R.array.decoy_titles)[decoy - 1]
                      val lines = res.getStringArray(
                          when (decoy) {
                              1 -> R.array.decoy_1
                              2 -> R.array.decoy_2
                              3 -> R.array.decoy_3
                              else -> R.array.decoy_4
                          }
                      )
                      root.addView(DecoyView(this, decoy, title, lines), full)
                      return
                  }
                  val iv = ImageView(this)
                  iv.scaleType = ImageView.ScaleType.CENTER_CROP
                  val a = opacity.coerceIn(10, 100)
                  var photoDone = false
                  if (prefs.getBoolean("photo", false)) {
                      val ver = prefs.getInt("photoVer", 0)
                      if (bmp == null || bmpVer != ver) {
                          bmp = try {
                              BitmapFactory.decodeFile(File(filesDir, "veil.jpg").path)
                          } catch (e: Exception) {
                              null
                          }
                          bmpVer = ver
                      }
                      val b = bmp
                      if (b != null) {
                          iv.setBackgroundColor(Color.TRANSPARENT)
                          iv.setImageBitmap(b)
                          iv.imageAlpha = a * 255 / 100
                          photoDone = true
                      }
                  }
                  if (!photoDone) {
                      val base = Cfg.veilColors[prefs.getInt("vstyle", 3).coerceIn(0, Cfg.veilColors.size - 1)]
                      iv.setBackgroundColor((base and 0x00FFFFFF) or ((a * 255 / 100) shl 24))
                  }
                  root.addView(iv, full)
              }

              private fun applyBubble(show: Boolean, ime: Int, active: Boolean) {
                  if (!show) {
                      hideBubble()
                      return
                  }
                  val dm = resources.displayMetrics
                  val sizeDp = prefs.getInt("csize", 42)
                  val h = dp(sizeDp)
                  val w = (h * 2.1f).toInt()
                  val look = "$sizeDp/${prefs.getInt("cshape", 0)}/${prefs.getInt("cstyle", 0)}/${prefs.getInt("ccolor", 0)}/${prefs.getString("lang", "")}"
                  if (bubble != null && lookKey != look) hideBubble()

                  val x: Int
                  val y: Int
                  if (prefs.getBoolean("moved", false)) {
                      x = prefs.getInt("cx", 0).coerceIn(0, maxOf(0, dm.widthPixels - w))
                      y = prefs.getInt("cy", 0).coerceIn(0, maxOf(0, dm.heightPixels - h))
                  } else {
                      x = when (prefs.getInt("ctl", 2)) {
                          0 -> dp(12)
                          1 -> (dm.widthPixels - w) / 2
                          else -> dm.widthPixels - w - dp(12)
                      }
                      y = (if (ime > 0) ime - h - dp(8) else (dm.heightPixels * 0.7f).toInt()).coerceAtLeast(0)
                  }

                  val b = bubble ?: createBubble(w, h, x, y)
                  lookKey = look
                  val key = "$x/$y/$active"
                  if (bubbleKey != key && !dragging) {
                      b.text = Lang.wrap(this).getString(if (active) R.string.off_btn else R.string.veil_btn)
                      val lp = b.layoutParams as WLP
                      lp.x = x
                      lp.y = y
                      wm.updateViewLayout(b, lp)
                      bubbleKey = key
                  }
              }

              private fun createBubble(w: Int, h: Int, x: Int, y: Int): TextView {
                  val t = TextView(this)
                  Cfg.styleControl(this, t, prefs)
                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var longPressed = false
                  val longRun = Runnable {
                      longPressed = true
                      peek(true)
                  }
                  t.setOnTouchListener { v, ev ->
                      val lp = v.layoutParams as WLP
                      val dm = resources.displayMetrics
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX
                              downY = ev.rawY
                              startX = lp.x
                              startY = lp.y
                              dragging = false
                              longPressed = false
                              handler.postDelayed(longRun, 350)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = ev.rawX - downX
                              val dy = ev.rawY - downY
                              if (!dragging && !longPressed && (abs(dx) > slop || abs(dy) > slop)) {
                                  dragging = true
                                  handler.removeCallbacks(longRun)
                              }
                              if (dragging) {
                                  lp.x = (startX + dx).toInt().coerceIn(0, maxOf(0, dm.widthPixels - v.width))
                                  lp.y = (startY + dy).toInt().coerceIn(0, maxOf(0, dm.heightPixels - v.height))
                                  wm.updateViewLayout(v, lp)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              handler.removeCallbacks(longRun)
                              if (dragging) {
                                  prefs.edit().putBoolean("moved", true).putInt("cx", lp.x).putInt("cy", lp.y).apply()
                                  dragging = false
                              } else if (longPressed) {
                                  peek(false)
                              } else {
                                  onBubbleTap()
                              }
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(longRun)
                              dragging = false
                              if (longPressed) peek(false)
                          }
                      }
                      true
                  }
                  val lp = WLP(
                      w,
                      h,
                      WLP.TYPE_ACCESSIBILITY_OVERLAY,
                      WLP.FLAG_NOT_FOCUSABLE or WLP.FLAG_LAYOUT_IN_SCREEN or WLP.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.LEFT
                  lp.x = x
                  lp.y = y
                  wm.addView(t, lp)
                  bubble = t
                  bubbleKey = ""
                  return t
              }

              private fun peek(on: Boolean) {
                  val v = veil ?: return
                  v.animate().cancel()
                  v.alpha = if (on) 0f else 1f
              }

              private fun onBubbleTap() {
                  if (prefs.getBoolean("full", false)) {
                      prefs.edit().putBoolean("full", false).apply()
                  } else if (lastIme > 0) {
                      kbToggled = !kbToggled
                      refresh()
                  } else {
                      prefs.edit().putBoolean("full", true).apply()
                  }
              }

              private fun updateNotification() {
                  val nm = getSystemService(NotificationManager::class.java) ?: return
                  val want = prefs.getBoolean("notif", false) && prefs.getBoolean("on", true)
                  val full = prefs.getBoolean("full", false)
                  val key = "$want/$full/${prefs.getString("lang", "")}"
                  if (key == notifKey) return
                  notifKey = key
                  if (!want) {
                      nm.cancel(NOTIF_ID)
                      return
                  }
                  val lc = Lang.wrap(this)
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL, lc.getString(R.string.notif_channel), NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val pi = PendingIntent.getBroadcast(
                      this,
                      1,
                      Intent(this, ToggleReceiver::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, CHANNEL) else Notification.Builder(this)
                  b.setSmallIcon(android.R.drawable.ic_menu_view)
                  b.setContentTitle(lc.getString(R.string.app_title))
                  b.setContentText(lc.getString(if (full) R.string.notif_on else R.string.notif_off))
                  b.setContentIntent(pi)
                  b.setOngoing(true)
                  b.setOnlyAlertOnce(true)
                  b.setShowWhen(false)
                  nm.notify(NOTIF_ID, b.build())
              }

              private fun hideVeil() {
                  val v = veil ?: return
                  veil = null
                  layoutKey = ""
                  styleKey = ""
                  val ms = animMs()
                  if (ms > 0) {
                      v.animate().cancel()
                      v.animate().alpha(0f).setDuration(ms).withEndAction {
                          try {
                              wm.removeView(v)
                          } catch (e: Exception) {
                          }
                      }.start()
                  } else {
                      try {
                          wm.removeView(v)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun hideVeilNow() {
                  val v = veil ?: return
                  try {
                      wm.removeView(v)
                  } catch (e: Exception) {
                  }
                  veil = null
                  layoutKey = ""
                  styleKey = ""
              }

              private fun hideBubble() {
                  val b = bubble ?: return
                  try {
                      wm.removeView(b)
                  } catch (e: Exception) {
                  }
                  bubble = null
                  bubbleKey = ""
              }

              private fun removeAllNow() {
                  hideBubble()
                  hideVeilNow()
              }
          }
          EOF

