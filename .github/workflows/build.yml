              <string name="apps_t">Apps</string>
              <string name="quiet_t">Quiet hours</string>
              <string name="quiet_d">No automatic app veil between these hours.</string>
              <string name="quiet_from">From %1$d:00</string>
              <string name="quiet_to">To %1$d:00</string>
              <string name="tile_t">Quick Settings tile</string>
              <string name="tile_d">Arm and disarm the veil from your Quick Settings panel</string>
              <string name="add">Add</string>
              <string name="tile_hint">Swipe down, tap the pencil, and drag the tile into your panel.</string>
              <string name="try_t">Try it here</string>
              <string name="try_off">Not armed yet</string>
              <string name="try_on">Tap here to type</string>
              <string name="try_d">Arm the veil above, then tap this box.</string>
              <string name="wild_t">In the wild</string>
              <string name="w1">Keyboard opens and a small control lands on it</string>
              <string name="w2">Tap Veil and the screen drops under cover</string>
              <string name="w3">Your own text stays faintly readable through it</string>
              <string name="w4">Press and hold the control to peek underneath</string>
              <string name="w5">Tap Off, or close the keyboard, to end it</string>
              <string name="support">Support</string>
              <string name="lang_t">Language</string>
              <string name="lang_d">Used throughout the app.</string>
              <string name="about_t">Privacy</string>
              <string name="about_d">What this app can and cannot see.</string>
              <string name="about_msg">Veil uses an accessibility service only to know whether a keyboard is on screen and, for the automatic app veil, which app is open. It never reads what you type or any text on screen, has no internet access and sends nothing anywhere.</string>
              <string name="replay">Replay the walkthrough</string>
              <string name="walk_t">How it works</string>
              <string name="veil_btn">Veil</string>
              <string name="off_btn">Off</string>
              <string name="notif_channel">Veil control</string>
              <string name="notif_on">Veil is on. Tap to lift it</string>
              <string name="notif_off">Tap to veil the whole screen</string>
              <string name="look_size">Size</string>
