                  }
                  ui.desc(s(R.string.pos_d))

                  val size = p.getInt("csize", 42)
                  val shape = arr(R.array.shape_names)[p.getInt("cshape", 0).coerceIn(0, 2)]
                  val style = arr(R.array.cstyle_names)[p.getInt("cstyle", 0).coerceIn(0, 2)]
                  val color = arr(R.array.ccolor_names)[p.getInt("ccolor", 0).coerceIn(0, 4)]
                  ui.nav(s(R.string.look_t), "$size · $shape · $style · $color", s(R.string.open).uppercase()) { page("look") }

                  ui.head(s(R.string.anim_t))
                  ui.chips(arr(R.array.anim_names), "anim", 1)

                  ui.nav(s(R.string.whole_t), s(R.string.whole_d), s(R.string.open).uppercase()) { page("whole") }
                  ui.nav(s(R.string.auto_t), s(R.string.auto_d), s(R.string.open).uppercase()) { page("auto") }
                  ui.nav(s(R.string.tile_t), s(R.string.tile_d), s(R.string.add).uppercase()) { addTile() }

                  ui.section(s(R.string.try_t))
                  ui.input(s(if (on && p.getBoolean("on", true)) R.string.try_on else R.string.try_off))
                  ui.desc(s(R.string.try_d))

                  ui.section(s(R.string.wild_t))
                  val steps = intArrayOf(R.string.w1, R.string.w2, R.string.w3, R.string.w4, R.string.w5)
                  for (i in steps.indices) {
                      ui.body("0${i + 1}   " + s(steps[i]), 16f, 0xFFA8A8A8.toInt(), 14)
                  }

                  ui.section(s(R.string.support))
                  val codes = arrayOf("", "en", "ar")
                  val names = arr(R.array.lang_names)
                  val cur = maxOf(0, codes.indexOf(p.getString("lang", "") ?: ""))
                  ui.nav(s(R.string.lang_t), s(R.string.lang_d), names[cur].uppercase()) {
                      AlertDialog.Builder(this).setItems(names) { _, i ->
                          p.edit().putString("lang", codes[i]).apply()
                          recreate()
                      }.show()
                  }
                  ui.nav(s(R.string.about_t), s(R.string.about_d), "") {
                      AlertDialog.Builder(this).setTitle(s(R.string.about_t)).setMessage(s(R.string.about_msg)).show()
                  }
                  ui.link(s(R.string.replay)) {
                      val t = steps.indices.joinToString("\n\n") { "${it + 1}. " + s(steps[it]) }
                      AlertDialog.Builder(this).setTitle(s(R.string.walk_t)).setMessage(t).show()
                  }
              }

              private fun addTile() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      try {
                          val sbm = getSystemService(StatusBarManager::class.java)
                          sbm.requestAddTileService(
                              ComponentName(this, VeilTile::class.java),
                              s(R.string.tile_label),
                              Icon.createWithResource(this, android.R.drawable.ic_menu_view),
                              mainExecutor
                          ) { }
                          return
                      } catch (e: Exception) {
                      }
                  }
                  Toast.makeText(this, s(R.string.tile_hint), Toast.LENGTH_LONG).show()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != pickCode || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                      var sample = 1
                      while (o.outWidth / sample > 1600 || o.outHeight / sample > 1600) sample *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = sample
                      val bmp = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o2) }
                      if (bmp == null) {
                          Toast.makeText(this, s(R.string.photo_fail), Toast.LENGTH_SHORT).show()
                          return
                      }
                      FileOutputStream(File(filesDir, "veil.jpg")).use {
                          bmp.compress(Bitmap.CompressFormat.JPEG, 90, it)
                      }
                      p.edit().putBoolean("photo", true).putInt("photoVer", p.getInt("photoVer", 0) + 1).apply()
                      Toast.makeText(this, s(R.string.photo_ok), Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, s(R.string.photo_fail), Toast.LENGTH_SHORT).show()
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val v = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return v.contains("$packageName/")
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Veil v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
